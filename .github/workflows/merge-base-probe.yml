name: Merge base probe
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
jobs:
  # Port of the resolver from argos-ci/argos-javascript#371, instrumented to
  # show which guard fires, across every realistic checkout configuration.
  probe:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v6-default
            v4: false
            depth: "1"
            ref: ""
            creds: "true"
          - name: v4-default
            v4: true
            depth: "1"
            ref: ""
            creds: "true"
          - name: v6-depth-0
            v4: false
            depth: "0"
            ref: ""
            creds: "true"
          - name: v6-depth-50
            v4: false
            depth: "50"
            ref: ""
            creds: "true"
          - name: v6-head-ref
            v4: false
            depth: "1"
            ref: "refs/pull/${{ github.event.pull_request.number }}/head"
            creds: "true"
          - name: v6-no-persist-creds
            v4: false
            depth: "1"
            ref: ""
            creds: "false"
    steps:
      - name: Checkout v6
        if: ${{ !matrix.v4 }}
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.depth }}
          ref: ${{ matrix.ref }}
          persist-credentials: ${{ matrix.creds }}
      - name: Checkout v4
        if: ${{ matrix.v4 }}
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.depth }}
          ref: ${{ matrix.ref }}
          persist-credentials: ${{ matrix.creds }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run probe
        run: node scripts/merge-base-probe.mjs

  # Runs the real @argos-ci/core resolver, bundled straight from the
  # argos-javascript source, against the same git context.
  real-source:
    name: real source (argos-javascript@${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, fix/test-merge-ref]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: argos-ci/argos-javascript
          ref: ${{ matrix.ref }}
          path: .argos-src
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Report the source under test
        run: |
          cd .argos-src
          echo "argos-javascript @ $(git rev-parse HEAD)"
          echo "contains getTestMergeBaseCommitSha: $(grep -c getTestMergeBaseCommitSha packages/core/src/ci-environment/services/github-actions.ts)"
      - name: Bundle the real resolver
        run: |
          npm i --no-save --no-audit --no-fund esbuild p-retry debug
          {
            echo 'export { getMergeBaseCommitSha, listAncestorCommits } from "./.argos-src/packages/core/src/ci-environment/index";'
            echo 'export { resolveBaseline, PARENT_COMMITS_LIMIT } from "./.argos-src/packages/core/src/find-reference-commit";'
          } > entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=esm --packages=external --outfile=bundle.mjs --log-level=warning
          echo "bundle: $(wc -c < bundle.mjs) bytes"
      - name: Read the expected base from the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.parents[0].sha')
          echo "The test-merge commit's first parent is $EXPECTED"
          echo "EXPECTED_BASE=$EXPECTED" >> "$GITHUB_ENV"
      - name: Run the real resolver
        env:
          DEBUG: "@argos-ci/core"
        run: node scripts/real-source-probe.mjs
      - name: Resolve the baseline the way the CLI does
        env:
          DEBUG: "@argos-ci/core"
          # The commit this branch forked from, i.e. the baseline an unrebased
          # branch used to get before the test-merge resolution landed.
          FORK_POINT: e5ba9c1843b38f6910ed27ef8ac05f6519314ea8
        run: node scripts/resolve-baseline-probe.mjs
      - name: Reproduce the stale payload
        env:
          DEBUG: "@argos-ci/core"
          FORK_POINT: e5ba9c1843b38f6910ed27ef8ac05f6519314ea8
          # Stands in for a head.sha that lags behind the merge ref.
          STALE_HEAD_SHA: 626626617c7f9886c8262609d07eda0fa79eabd2
        run: node scripts/stale-payload-probe.mjs
