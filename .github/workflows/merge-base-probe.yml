name: Merge base probe
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
jobs:
  # Port of the resolver from argos-ci/argos-javascript#371, instrumented to
  # show which guard fires, across every realistic checkout configuration.
  probe:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v6-default
            v4: false
            depth: "1"
            ref: ""
            creds: "true"
          - name: v4-default
            v4: true
            depth: "1"
            ref: ""
            creds: "true"
          - name: v6-depth-0
            v4: false
            depth: "0"
            ref: ""
            creds: "true"
          - name: v6-depth-50
            v4: false
            depth: "50"
            ref: ""
            creds: "true"
          - name: v6-head-ref
            v4: false
            depth: "1"
            ref: "refs/pull/${{ github.event.pull_request.number }}/head"
            creds: "true"
          - name: v6-no-persist-creds
            v4: false
            depth: "1"
            ref: ""
            creds: "false"
    steps:
      - name: Checkout v6
        if: ${{ !matrix.v4 }}
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.depth }}
          ref: ${{ matrix.ref }}
          persist-credentials: ${{ matrix.creds }}
      - name: Checkout v4
        if: ${{ matrix.v4 }}
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.depth }}
          ref: ${{ matrix.ref }}
          persist-credentials: ${{ matrix.creds }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run probe
        run: node scripts/merge-base-probe.mjs

  # Runs the real @argos-ci/core resolver, bundled straight from the
  # argos-javascript source, against the same git context.
  real-source:
    name: real source (argos-javascript@${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: argos-ci/argos-javascript
          ref: ${{ matrix.ref }}
          path: .argos-src
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Report the source under test
        run: |
          cd .argos-src
          echo "argos-javascript @ $(git rev-parse HEAD)"
          echo "contains getTestMergeBaseCommitSha: $(grep -c getTestMergeBaseCommitSha packages/core/src/ci-environment/services/github-actions.ts)"
      - name: Bundle the real resolver
        run: |
          npm i --no-save --no-audit --no-fund esbuild p-retry debug
          echo 'export { getMergeBaseCommitSha, listAncestorCommits } from "./.argos-src/packages/core/src/ci-environment/index";' > entry.ts
          npx esbuild entry.ts --bundle --platform=node --format=esm --outfile=bundle.mjs --log-level=warning
          echo "bundle: $(wc -c < bundle.mjs) bytes"
      - name: Run the real resolver
        env:
          DEBUG: "@argos-ci/core"
        run: node scripts/real-source-probe.mjs
