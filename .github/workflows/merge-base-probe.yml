name: Merge base probe
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v6-default
            v4: false
            depth: "1"
            ref: ""
            creds: "true"
          - name: v4-default
            v4: true
            depth: "1"
            ref: ""
            creds: "true"
          - name: v6-depth-0
            v4: false
            depth: "0"
            ref: ""
            creds: "true"
          - name: v6-depth-50
            v4: false
            depth: "50"
            ref: ""
            creds: "true"
          - name: v6-head-ref
            v4: false
            depth: "1"
            ref: "refs/pull/${{ github.event.pull_request.number }}/head"
            creds: "true"
          - name: v6-no-persist-creds
            v4: false
            depth: "1"
            ref: ""
            creds: "false"
    steps:
      - name: Checkout v6
        if: ${{ !matrix.v4 }}
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.depth }}
          ref: ${{ matrix.ref }}
          persist-credentials: ${{ matrix.creds }}
      - name: Checkout v4
        if: ${{ matrix.v4 }}
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.depth }}
          ref: ${{ matrix.ref }}
          persist-credentials: ${{ matrix.creds }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run probe
        run: node scripts/merge-base-probe.mjs
