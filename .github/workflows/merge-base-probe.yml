name: Merge base probe
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run probe
        run: node scripts/merge-base-probe.mjs
